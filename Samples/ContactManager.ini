[var]
THUNDER="C:\\Program Files (x86)\\Mozilla Thunderbird\\thunderbird.exe"

[general]
codec=UTF-8

[database]
path="$CONFIG/ContactManager"

[journal]
path="$CONFIG/EasyNotepad/Massage Clients"
easynotepadexe="$APPDIR/EasyNotepad.exe"

[google]
debug=no

[phone]
localcode=01234
countrycode=0044

[sms-reminder]
; agent is Voodoo or Esendex.  For Voodoo, username is the HTTP API username.
; For Esendex, username is the account reference (My Account), and the SMS password in Settings is the API key.
agent=Voodoo
username=
; sender is the name shown to the recipient (Esendex: letters and digits, a name registered in Esendex).  If blank, the
; first line of the SMS message file is used.
# sender=
debug=no

[email-reminder]
server=smtp.gmail.com
username=gmailaccount@gmail.com
port=465
; sender is the From address, written as "Name <address>".  If not set, the first line of the email message file is used.
# sender=
debug=no

[reminders]
; The reminder is sent this many hours before an appointment (24 is the day before).
remindhoursbefore=24

; An appointment made or changed less than this many hours before it starts gets its
; confirmation or update only, with no reminder.  If this is missing, or is not a number,
; or is less than remindhoursbefore, remindhoursbefore x 1.5 is used (36 with the defaults).
confirmonlyhours=36

; Messages are sent only between these times, in local time.  Anything due outside them
; waits until earliestsend.
earliestsend=07:00
latestsend=22:00

; A new or changed appointment waits this many minutes after its last change before its
; message is sent, so mistakes can be corrected first.  0 is allowed.
waitbeforesendmins=5

; The most messages to one contact in any 24 hours, and in any hour.
limitperday=10
limitperhour=5

; Attach an .ics calendar entry to emails: yes or no.
attachics=no

[email]
command="\"$THUNDER\" -compose \"subject='Message to $NAME',to='$TO'\" "

[message]
emailconfirmation="$CONFIG/ContactManager/messages/emailconfirmation.msg"
emailupdate="$CONFIG/ContactManager/messages/emailupdate.msg"
emaildelete="$CONFIG/ContactManager/messages/emaildelete.msg"
emailreminder="$CONFIG/ContactManager/messages/emailreminder.msg"
smsconfirmation="$CONFIG/ContactManager/messages/smsconfirmation.msg"
smsupdate="$CONFIG/ContactManager/messages/smsupdate.msg"
smsdelete="$CONFIG/ContactManager/messages/smsdelete.msg"
smsreminder="$CONFIG/ContactManager/messages/smsreminder.msg"

[help]
h1="INI configuration entries can contain variables as follows  "
h2="  $HOME     - The user's home directory                     "
h3="  $CONFIG   - $HOME/TrumptonApps                            "
h4="  $INI      - The folder ContactManager.ini was loaded from "
h5="  $APPDIR   - The folder ContactManager.exe was loaded from "
h6="  $TO       - Recipient of email message (for Control-M)    "
h7="  $NAME     - Name of email recipient (for Control-M)       "
h8="  Plus anything defined in the 'var' section                "
h9="  $APPOINTMENTS - Message templates: the contact's next appointments, one per line (email) or on one line separated by '; ' (subject, SMS)"

